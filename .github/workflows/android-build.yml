name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/miri-community-app-hnhoj
    tags:
      - 'v*'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            find android/app/build/outputs -type f || true
            exit 1
          fi
          SHORT_SHA=${GITHUB_SHA::7}
          OUT="miri-comunity-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$OUT"
          echo "apk_name=$OUT" >> "$GITHUB_OUTPUT"
          # Also produce a stable filename for tag-based releases so the
          # /releases/latest/download/miri-comunity.apk URL stays valid.
          cp "$APK_PATH" "miri-comunity.apk"
          ls -lh "$OUT" miri-comunity.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miri-comunity-apk
          path: ${{ steps.find_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/outputs/logs/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_name }}
            miri-comunity.apk
          generate_release_notes: true
